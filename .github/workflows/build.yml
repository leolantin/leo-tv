name: Android APK Build



on:

  push:

  workflow_dispatch:



jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4



      - uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: 17



      - uses: gradle/actions/setup-gradle@v4

        with:

          gradle-version: 8.9



      - name: Compiler

        run: gradle assembleDebug --stacktrace > build.log 2>&1



      - name: Afficher les erreurs

        if: failure()

        run: |

          echo "### Erreurs de compilation" >> $GITHUB_STEP_SUMMARY

          echo '```' >> $GITHUB_STEP_SUMMARY

          grep -E "error:|What went wrong" -A3 build.log | head -60 >> $GITHUB_STEP_SUMMARY || true

          echo '```' >> $GITHUB_STEP_SUMMARY



      - uses: actions/upload-artifact@v4

        with:

          name: LEO-TV-APK

          path: app/build/outputs/apk/debug/*.apk
